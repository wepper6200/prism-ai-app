name: Apple and portable native bridge
on:
  push:
    branches: ["codex/prism-ios-0.9.8"]
  workflow_dispatch:
    inputs:
      replay_run_id:
        description: Existing simulator artifact run for a fast plist and model validation
        required: false
        default: ""
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: apple-${{ github.ref }}-${{ inputs.replay_run_id || 'build' }}
  cancel-in-progress: true
jobs:
  ios-framework:
    if: ${{ !inputs.replay_run_id }}
    name: iOS shared framework
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build iPhone simulator application
        run: bash iosApp/build.sh iphonesimulator Debug
      - name: Package simulator app for interactive testing
        run: ditto -c -k --keepParent iosApp/DerivedData/Build/Products/Debug-iphonesimulator/PrismAI.app build/PrismAI-iOS-Simulator.zip
      - uses: actions/upload-artifact@v6
        with:
          name: PrismAI-iOS-Simulator
          path: build/PrismAI-iOS-Simulator.zip
      - name: Free compiler memory before simulator tests
        run: ./gradlew --stop
      - name: Run offline inference inside the iPhone simulator
        timeout-minutes: 15
        run: python3 iosApp/smoke.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-simulator-smoke
          path: build/ios-smoke/
          if-no-files-found: ignore
      - name: Build unsigned iPhone and iPad package
        run: bash iosApp/build.sh iphoneos Release
      - uses: actions/upload-artifact@v6
        with:
          name: PrismAI-iOS-unsigned
          path: build/PrismAI-unsigned.ipa
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-framework-diagnostics
          path: |
            shared/build/reports/
            shared/build/bin/iosSimulatorArm64/debugFramework/PrismShared.framework/Headers/PrismShared.h
          if-no-files-found: ignore
  portable-bridge:
    if: ${{ !inputs.replay_run_id }}
    name: Portable llama.cpp C API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install archive test headers
        run: sudo apt-get update && sudo apt-get install -y libbz2-dev zlib1g-dev
      - name: Build C bridge
        run: |
          cmake -S native/apple -B native/build/portable -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build/portable --target prism_bridge_smoke prism_archive_check --parallel 2
      - name: Verify offline voice archives and DOCX bounds
        run: python3 native/apple/test_archives.py native/build/portable/libprism_archive_check.so
      - name: Download and verify tiny inference fixture
        run: |
          curl -fL --retry 5 -o /tmp/tiny.gguf https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
          echo '270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  /tmp/tiny.gguf' | sha256sum -c -
      - name: Exercise streaming, cancellation, reuse and missing model errors
        run: native/build/portable/prism_bridge_smoke /tmp/tiny.gguf

  ios-replay:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.replay_run_id != '' }}
    name: Replay simulator model checks
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: PrismAI-iOS-Simulator
          path: build/replay
          run-id: ${{ inputs.replay_run_id }}
          github-token: ${{ github.token }}
      - name: Prepare the existing app with current plist settings
        run: |
          mkdir -p iosApp/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -x -k build/replay/PrismAI-iOS-Simulator.zip iosApp/DerivedData/Build/Products/Debug-iphonesimulator
          python3 - <<'PY'
          import pathlib, plistlib
          target = pathlib.Path("iosApp/DerivedData/Build/Products/Debug-iphonesimulator/PrismAI.app/Info.plist")
          info = plistlib.loads(target.read_bytes())
          info["CADisableMinimumFrameDurationOnPhone"] = True
          target.write_bytes(plistlib.dumps(info))
          PY
          codesign --force --deep --sign - --timestamp=none iosApp/DerivedData/Build/Products/Debug-iphonesimulator/PrismAI.app
      - name: Run offline model checks without recompiling Kotlin
        timeout-minutes: 15
        run: python3 iosApp/smoke.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-replay-smoke
          path: build/ios-smoke/
          if-no-files-found: ignore
