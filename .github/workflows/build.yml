name: Build

on:
  push:
    branches: [main, "claude/**", "ccr-**"]
    # Релиз на GitHub (задание release): тег vX.Y.Z или коммит со словом [release] в сообщении —
    # тогда тег v<prism-versionName> создаётся на этом коммите.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Новый пуш отменяет прошлую сборку ветки; долгий замер видео ([phone-video-bench]) — в своей группе.
  group: ci-${{ github.ref }}${{ (contains(github.event.head_commit.message, '[phone-video-bench]') || contains(github.event.head_commit.message, '[phone-video-arch]')) && '-bench' || '' }}
  cancel-in-progress: true

env:
  # Маленькие модели для интеграционных тестов llama.cpp (проверяются по SHA-256).
  TINY_MODEL_URL: https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
  TINY_MODEL_SHA256: 270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d
  GEMMA_TEST_URL: https://huggingface.co/ggml-org/gemma-3-270m-it-GGUF/resolve/main/gemma-3-270m-it-Q8_0.gguf
  GEMMA_TEST_SHA256: 0ef57d2c838458a1952664260dcba38e5bdda37494f3af732f06e4add24068e3
  # Понимание изображений: крошечная SmolVLM и Gemma 4 E2B (модель для телефона) с модулями зрения.
  VLM_TEST_URL: https://huggingface.co/ggml-org/SmolVLM-256M-Instruct-GGUF/resolve/main/SmolVLM-256M-Instruct-Q8_0.gguf
  VLM_TEST_SHA256: 2a31195d3769c0b0fd0a4906201666108834848db768af11de1d2cef7cd35e65
  VLM_MMPROJ_URL: https://huggingface.co/ggml-org/SmolVLM-256M-Instruct-GGUF/resolve/main/mmproj-SmolVLM-256M-Instruct-Q8_0.gguf
  VLM_MMPROJ_SHA256: 7e943f7c53f0382a6fc41b6ee0c2def63ba4fded9ab8ed039cc9e2ab905e0edd
  GEMMA4_TEST_URL: https://huggingface.co/ggml-org/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_0.gguf
  GEMMA4_TEST_SHA256: 8e30dff3ac4c8434c49a7036fa15564bdbb6044e42bf04550bf1a096ad7e6a52
  GEMMA4_MMPROJ_URL: https://huggingface.co/ggml-org/gemma-4-E2B-it-GGUF/resolve/main/mmproj-gemma-4-E2B-it-Q8_0.gguf
  GEMMA4_MMPROJ_SHA256: 042cc2561806cd3b5cb5efb25cab76911e3100c43cc09d854904f921924b1429
  # Генерация изображений: SDXL-Lightning (модель для телефона) и FLUX.1 [schnell] Q4 (модель для Windows).
  SDXL_TEST_URL: https://huggingface.co/mzwing/SDXL-Lightning-GGUF/resolve/main/sdxl_lightning_4step.q4_0.gguf
  SDXL_TEST_SHA256: 33cc25b6f5dd121ecf3ad28e35eb38cb21427b7794c53527ceafe2dc3b109f4f
  TAESDXL_URL: https://huggingface.co/madebyollin/taesdxl/resolve/main/diffusion_pytorch_model.safetensors
  TAESDXL_SHA256: ff4824aca94dd6111e0340fa749347fb74101060d9712cb5ef1ca8f1cf17502f
  # Поиск по файлам: EmbeddingGemma 300M (та же, что в каталоге).
  EMBED_TEST_URL: https://huggingface.co/ggml-org/embeddinggemma-300M-GGUF/resolve/main/embeddinggemma-300M-Q8_0.gguf
  EMBED_TEST_SHA256: b5ce9d77a3fc4b3b39ccb5643c36777911cc4eb46a66962eadfa3f5f60490d63

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Fetch ggml for stable-diffusion.cpp
        shell: bash
        run: git -C native/stable-diffusion.cpp submodule update --init --depth 1 ggml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64
          max-size: 1G
      - name: Provision Gradle (retries on network errors)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download failed, retry $i"; sleep $((i * 15))
          done
          exit 1
      - name: Install Android NDK and CMake
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # yes завершается с «Broken pipe», когда sdkmanager перестаёт читать, — это не ошибка.
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;29.0.13113456" "cmake;3.31.6" > /dev/null
      - name: Signing key (repository secrets)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PRISM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PRISM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PRISM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PRISM_KEY_PASSWORD }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]') }}
        run: |
          # Один и тот же ключ во всех сборках — иначе Android не ставит новую версию поверх старой.
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$RELEASE" = "true" ]; then
              echo "::error::Нет секрета PRISM_KEYSTORE_BASE64: релиз без постоянного ключа нельзя установить поверх прошлой версии."
              exit 1
            fi
            echo "::warning::Секретов PRISM_KEYSTORE_* нет — APK подписан отладочным ключом этой сборки."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/prism.jks"
          {
            echo "PRISM_KEYSTORE_FILE=$RUNNER_TEMP/prism.jks"
            echo "PRISM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PRISM_KEY_ALIAS=$KEY_ALIAS"
            echo "PRISM_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build debug APK with llama.cpp (warnings are errors)
        run: ./gradlew --stacktrace --warning-mode=all -Pprism.ccache=true :androidApp:assembleDebug :store:androidApp:assembleDebug
      - name: Show APK signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs androidApp/build/outputs/apk/debug/*.apk | grep -E "SHA-256|DN" | head -3
      - name: Check native libraries in APK
        run: |
          apk=$(ls androidApp/build/outputs/apk/debug/*.apk)
          unzip -l "$apk" | grep -E "lib/arm64-v8a/.*\.so" | tee native-libs.txt
          grep -q "libprism_llama.so" native-libs.txt
          grep -q "libmtmd.so" native-libs.txt
          grep -q "libprism_imagegen.so" native-libs.txt
          grep -q "libprism_imagegen_i8mm.so" native-libs.txt
          grep -q "libggml-cpu-android_armv8.0_1.so" native-libs.txt
          grep -q "libsherpa-onnx-jni.so" native-libs.txt
          grep -q "libonnxruntime.so" native-libs.txt
      - name: Show compiler warnings (diagnostics on failure)
        if: failure()
        run: |
          ./gradlew --console=plain -Pprism.werror=false --rerun-tasks \
            :shared:compileAndroidMain :androidApp:compileDebugKotlin 2>&1 \
            | grep -E '^(w|e): ' || echo "No compiler warnings printed"
      - uses: actions/upload-artifact@v6
        with:
          name: PrismAI-android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: PrismStore-android-apk
          path: store/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop:
    name: Desktop build, tests and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Fetch ggml for stable-diffusion.cpp
        shell: bash
        run: git -C native/stable-diffusion.cpp submodule update --init --depth 1 ggml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: desktop-linux
          max-size: 1G
      - name: Cache test models
        uses: actions/cache@v4
        with:
          path: ~/prism-test-models
          key: test-models-${{ env.TINY_MODEL_SHA256 }}-${{ env.GEMMA_TEST_SHA256 }}-${{ env.VLM_TEST_SHA256 }}-${{ env.GEMMA4_TEST_SHA256 }}-${{ env.SDXL_TEST_SHA256 }}-${{ env.EMBED_TEST_SHA256 }}
      - name: Download test models
        shell: bash
        run: |
          mkdir -p ~/prism-test-models && cd ~/prism-test-models
          [ -f tiny.gguf ] || curl -fsSL --retry 5 -o tiny.gguf "$TINY_MODEL_URL"
          [ -f gemma.gguf ] || curl -fsSL --retry 5 -o gemma.gguf "$GEMMA_TEST_URL"
          echo "$TINY_MODEL_SHA256  tiny.gguf" | sha256sum -c -
          [ -f vlm.gguf ] || curl -fsSL --retry 5 -o vlm.gguf "$VLM_TEST_URL"
          [ -f vlm-mmproj.gguf ] || curl -fsSL --retry 5 -o vlm-mmproj.gguf "$VLM_MMPROJ_URL"
          [ -f gemma4.gguf ] || curl -fsSL --retry 5 -o gemma4.gguf "$GEMMA4_TEST_URL"
          [ -f gemma4-mmproj.gguf ] || curl -fsSL --retry 5 -o gemma4-mmproj.gguf "$GEMMA4_MMPROJ_URL"
          echo "$GEMMA_TEST_SHA256  gemma.gguf" | sha256sum -c -
          echo "$VLM_TEST_SHA256  vlm.gguf" | sha256sum -c -
          echo "$VLM_MMPROJ_SHA256  vlm-mmproj.gguf" | sha256sum -c -
          echo "$GEMMA4_TEST_SHA256  gemma4.gguf" | sha256sum -c -
          echo "$GEMMA4_MMPROJ_SHA256  gemma4-mmproj.gguf" | sha256sum -c -
          [ -f sdxl.gguf ] || curl -fsSL --retry 5 -o sdxl.gguf "$SDXL_TEST_URL"
          [ -f taesdxl.safetensors ] || curl -fsSL --retry 5 -o taesdxl.safetensors "$TAESDXL_URL"
          echo "$SDXL_TEST_SHA256  sdxl.gguf" | sha256sum -c -
          echo "$TAESDXL_SHA256  taesdxl.safetensors" | sha256sum -c -
          [ -f embed.gguf ] || curl -fsSL --retry 5 -o embed.gguf "$EMBED_TEST_URL"
          echo "$EMBED_TEST_SHA256  embed.gguf" | sha256sum -c -
          echo "PRISM_TEST_EMBED=$HOME/prism-test-models/embed.gguf" >> "$GITHUB_ENV"
          echo "PRISM_TEST_SDXL=$HOME/prism-test-models/sdxl.gguf" >> "$GITHUB_ENV"
          echo "PRISM_TEST_SDXL_TAESD=$HOME/prism-test-models/taesdxl.safetensors" >> "$GITHUB_ENV"
          echo "PRISM_TEST_MODEL=$HOME/prism-test-models/tiny.gguf" >> "$GITHUB_ENV"
          echo "PRISM_TEST_GEMMA=$HOME/prism-test-models/gemma.gguf" >> "$GITHUB_ENV"
          echo "PRISM_TEST_VLM=$HOME/prism-test-models/vlm.gguf" >> "$GITHUB_ENV"
          echo "PRISM_TEST_VLM_MMPROJ=$HOME/prism-test-models/vlm-mmproj.gguf" >> "$GITHUB_ENV"
          echo "PRISM_TEST_GEMMA4=$HOME/prism-test-models/gemma4.gguf" >> "$GITHUB_ENV"
          echo "PRISM_TEST_GEMMA4_MMPROJ=$HOME/prism-test-models/gemma4-mmproj.gguf" >> "$GITHUB_ENV"
      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: ~/prism-speech-models
          key: speech-models-${{ hashFiles('shared/src/commonMain/composeResources/files/models.json') }}
      - name: Download speech models (files and checksums from the catalog)
        shell: bash
        run: python3 .github/download_speech_models.py "$HOME/prism-speech-models" >> "$GITHUB_ENV"
      - name: Provision Gradle (retries on network errors)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download failed, retry $i"; sleep $((i * 15))
          done
          exit 1
      - name: Compile desktop app, build llama.cpp and run all tests (warnings are errors)
        run: ./gradlew --stacktrace --warning-mode=all -Pprism.skipAndroid=true -Pprism.nativeTests=true -Pprism.imagegen=true -Pprism.ccache=true :desktopApp:compileKotlin :shared:jvmTest :store:desktopApp:compileKotlin :store:shared:jvmTest
      - name: Show compiler warnings (diagnostics on failure)
        if: failure()
        run: |
          ./gradlew --console=plain -Pprism.skipAndroid=true -Pprism.werror=false --rerun-tasks \
            :shared:compileKotlinJvm :shared:compileTestKotlinJvm :desktopApp:compileKotlin 2>&1 \
            | grep -E '^(w|e): ' || echo "No compiler warnings printed"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: PrismAI-screenshots
          path: |
            shared/build/screenshots/
            store/shared/build/screenshots/
          if-no-files-found: warn
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: shared/build/reports/tests/
          if-no-files-found: ignore

  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Fetch ggml for stable-diffusion.cpp
        shell: bash
        run: git -C native/stable-diffusion.cpp submodule update --init --depth 1 ggml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          install_runtime: true
          cache: true
          stripdown: true
      - name: Provision Gradle (retries on network errors)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download failed, retry $i"; sleep $((i * 15))
          done
          exit 1
      - name: Download tiny test model
        shell: bash
        run: |
          mkdir -p "$HOME/prism-test-models" && cd "$HOME/prism-test-models"
          curl -fsSL --retry 5 -o tiny.gguf "$TINY_MODEL_URL"
          echo "$TINY_MODEL_SHA256  tiny.gguf" | sha256sum -c -
          echo "PRISM_TEST_MODEL=$(cygpath -w "$HOME/prism-test-models/tiny.gguf")" >> "$GITHUB_ENV"
          python "$GITHUB_WORKSPACE/.github/download_speech_models.py" "$(cygpath -w "$HOME/prism-test-models")" --only vad >> "$GITHUB_ENV"
      - name: Build Windows app with llama.cpp (CPU + Vulkan)
        shell: bash
        run: ./gradlew --stacktrace --warning-mode=all -Pprism.skipAndroid=true -Pprism.vulkan=true -Pprism.imagegen=true :desktopApp:createDistributable :store:desktopApp:createDistributable
      - name: Check DLL loading on Windows (llama.cpp, image generation and speech integration tests)
        shell: bash
        run: ./gradlew --stacktrace -Pprism.skipAndroid=true -Pprism.nativeTests=true -Pprism.vulkan=true -Pprism.imagegen=true :shared:jvmTest --tests "ai.prism.inference.llama.*" --tests "ai.prism.imagegen.ImageGenerationIntegrationTest" --tests "ai.prism.voice.VoiceDetectorNativeTest"
      - name: Check image generator in the Windows app
        shell: bash
        run: test -f desktopApp/build/compose/binaries/main/app/PrismAI/app/resources/prism_imagegen.exe || (find desktopApp/build/compose/binaries -name "prism_imagegen*" ; exit 1)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-test-reports
          path: shared/build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: PrismAI-windows
          path: desktopApp/build/compose/binaries/main/app/PrismAI/
      - uses: actions/upload-artifact@v6
        with:
          name: PrismStore-windows
          path: store/desktopApp/build/compose/binaries/main/app/PrismStore/
          if-no-files-found: error

  flux:
    name: Image generation (FLUX.1 schnell)
    # FLUX весит ~10 ГБ — не помещается в кэш Actions вместе с остальными моделями, качается каждый раз.
    # Для тега релиза не запускается: этот коммит уже проверен сборкой ветки.
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FLUX_DIR: /mnt/prism-flux
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Fetch ggml for stable-diffusion.cpp
        shell: bash
        run: git -C native/stable-diffusion.cpp submodule update --init --depth 1 ggml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: flux-linux
          max-size: 1G
      - name: Download FLUX.1 schnell Q4 (files and checksums from the catalog)
        shell: bash
        run: |
          sudo mkdir -p "$FLUX_DIR" && sudo chown "$USER" "$FLUX_DIR"
          python3 - <<'PY' > "$FLUX_DIR/files.txt"
          import json
          catalog = json.load(open("shared/src/commonMain/composeResources/files/models.json"))
          flux = next(m for m in catalog["models"] if m["id"].startswith("flux1-schnell"))
          files = [(flux["url"], flux["fileName"], flux["sha256"])] + [(c["url"], c["fileName"], c["sha256"]) for c in flux["components"]]
          for url, name, sha in files:
              print(url, name, sha)
          PY
          cd "$FLUX_DIR"
          while read -r url name sha; do
            curl -fsSL --retry 5 -o "$name" "$url"
            echo "$sha  $name" | sha256sum -c -
          done < files.txt
          echo "PRISM_TEST_FLUX_DIR=$FLUX_DIR" >> "$GITHUB_ENV"
      - name: Provision Gradle (retries on network errors)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download failed, retry $i"; sleep $((i * 15))
          done
          exit 1
      - name: Draw with FLUX.1 schnell on CPU
        run: ./gradlew --stacktrace -Pprism.skipAndroid=true -Pprism.nativeTests=true -Pprism.imagegen=true -Pprism.ccache=true :shared:jvmTest --tests "ai.prism.imagegen.ImageGenerationIntegrationTest"
      - name: Upload generated pictures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: PrismAI-flux-pictures
          path: shared/build/screenshots/
          if-no-files-found: warn

  video:
    name: Video generation (Wan 2.1 1.3B)
    # Wan 2.1 1.3B с энкодером umt5 — ~4 ГБ: качается каждый раз, как FLUX. Маленький ролик на процессоре.
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      WAN_DIR: /mnt/prism-wan
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Fetch ggml for stable-diffusion.cpp
        shell: bash
        run: git -C native/stable-diffusion.cpp submodule update --init --depth 1 ggml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: flux-linux
          max-size: 1G
      - name: Download Wan 2.1 1.3B (files and checksums from the catalog)
        shell: bash
        run: |
          sudo mkdir -p "$WAN_DIR" && sudo chown "$USER" "$WAN_DIR"
          python3 - <<'PY' > "$WAN_DIR/files.txt"
          import json
          catalog = json.load(open("shared/src/commonMain/composeResources/files/models.json"))
          wan = next(m for m in catalog["models"] if m["id"].startswith("wan2.1-t2v-1.3b"))
          files = [(wan["url"], wan["fileName"], wan["sha256"])] + [(c["url"], c["fileName"], c["sha256"]) for c in wan["components"]]
          for url, name, sha in files:
              print(url, name, sha)
          PY
          cd "$WAN_DIR"
          while read -r url name sha; do
            curl -fsSL --retry 5 -o "$name" "$url"
            echo "$sha  $name" | sha256sum -c -
          done < files.txt
          echo "PRISM_TEST_WAN_DIR=$WAN_DIR" >> "$GITHUB_ENV"
      - name: Provision Gradle (retries on network errors)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download failed, retry $i"; sleep $((i * 15))
          done
          exit 1
      - name: Make a video with Wan 2.1 1.3B on CPU
        run: ./gradlew --stacktrace -Pprism.skipAndroid=true -Pprism.nativeTests=true -Pprism.imagegen=true -Pprism.ccache=true :shared:jvmTest --tests "ai.prism.imagegen.VideoGenerationIntegrationTest"
      - name: Upload generated video
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: PrismAI-wan-video
          path: shared/build/screenshots/
          if-no-files-found: warn

  phone-video-bench:
    name: Phone video benchmark (ARM)
    # Что из видео реально работает на телефоне: prism_imagegen, собранный под ARMv8.2 как для Android, снимает
    # ролик 512×288 нынешней моделью телефона (Wan 2.1 1.3B), продолжение от кадра Wan 2.1 Fun InP 1.3B и
    # Wan 2.2 TI2V 5B; печатает время, пик памяти и шов. Только для коммита со словом [phone-video-bench].
    # [phone-video-arch] — короткое сравнение сборок: базовая ARMv8.2 и с i8mm (Wan 2.2 TI2V 5B, 3 шага).
    if: >-
      github.event_name == 'push' && (contains(github.event.head_commit.message, '[phone-video-bench]') ||
      contains(github.event.head_commit.message, '[phone-video-arch]'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Fetch ggml for stable-diffusion.cpp
        run: git -C native/stable-diffusion.cpp submodule update --init --depth 1 ggml
      - name: Build prism_imagegen for ARMv8.2 (dotprod, fp16 — as on Android)
        run: |
          cmake -S native/imagegen -B build/imagegen -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16
          cmake --build build/imagegen --config Release -j "$(nproc)"
          cmake -S native/imagegen -B build/imagegen-i8mm -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16+i8mm
          cmake --build build/imagegen-i8mm --config Release -j "$(nproc)"
          lscpu | head -20
          free -g
      - name: Benchmark video models
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 -m pip install --quiet pillow
          sudo mkdir -p /mnt/prism-bench && sudo chown "$USER" /mnt/prism-bench
          df -h /mnt "$HOME" | cat
          if [[ "$COMMIT_MESSAGE" == *"[phone-video-arch]"* ]]; then
            python3 .github/phone_video_bench.py --compare /mnt/prism-bench/models bench-out \
              build/imagegen/bin/prism_imagegen build/imagegen-i8mm/bin/prism_imagegen
          else
            python3 .github/phone_video_bench.py build/imagegen/bin/prism_imagegen /mnt/prism-bench/models bench-out
          fi
      - name: Upload videos and frames
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: PrismAI-phone-video-bench
          path: bench-out/
          if-no-files-found: warn

  catalog-report:
    name: Model catalog report
    # Облачная среда разработки не видит huggingface.co: размеры, SHA-256 и лицензии файлов для каталога
    # печатает это задание — для коммита со словом [catalog-report] в сообщении. Мелкие файлы и архивы скачивает,
    # чтобы посчитать SHA-256.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[catalog-report]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Query Hugging Face metadata
        run: python3 .github/catalog_report.py

  release:
    name: GitHub release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    needs: [android, desktop, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version and tag
        shell: bash
        run: |
          version=$(sed -n 's/^prism-versionName = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "Release v$version already exists: raise prism-versionName first"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          name: PrismAI-android-debug-apk
          path: artifacts/android
      - uses: actions/download-artifact@v7
        with:
          name: PrismAI-windows
          path: artifacts/windows/PrismAI
      - uses: actions/download-artifact@v7
        with:
          name: PrismStore-android-apk
          path: artifacts/store-android
      - uses: actions/download-artifact@v7
        with:
          name: PrismStore-windows
          path: artifacts/store-windows/PrismStore
      - name: Package
        shell: bash
        run: |
          store=$(sed -n 's/^store-versionName = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          mkdir dist
          cp artifacts/android/*.apk "dist/PrismAI-$VERSION-android-arm64.apk"
          (cd artifacts/windows && zip -qr9 "$GITHUB_WORKSPACE/dist/PrismAI-$VERSION-windows-x64.zip" PrismAI)
          cp artifacts/store-android/*.apk "dist/PrismStore-$store-android.apk"
          (cd artifacts/store-windows && zip -qr9 "$GITHUB_WORKSPACE/dist/PrismStore-$store-windows.zip" PrismStore)
          # Каталог Prism Store: версии, ссылки, размеры и SHA-256 файлов этого релиза.
          python3 .github/store_catalog.py dist "v$VERSION" > dist/prism-store-catalog.json
          cat dist/prism-store-catalog.json
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Prism AI ${{ env.VERSION }}
          body_path: .github/release-notes.md
          files: dist/*
