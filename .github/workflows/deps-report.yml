name: Dependency report

on:
  workflow_dispatch:
  push:
    branches: [claude/complex-mobile-app-u76tdy]
    paths: [.github/workflows/deps-report.yml]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Latest stable versions on Google Maven
        run: |
          for a in com/android/tools/build/gradle androidx/activity/activity-compose androidx/core/core-ktx; do
            v=$(curl -fsSL "https://dl.google.com/dl/android/maven2/$a/maven-metadata.xml" | grep -oE '<version>[^<]+' | sed 's/<version>//' | grep -viE 'alpha|beta|rc|dev' | sort -V | tail -3 | tr '\n' ' ')
            echo "$a: $v"
          done
      - name: Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
