name: Model catalog report

# Разовый отчёт о файлах GGUF на Hugging Face (размеры, SHA-256, лицензии)
# для каталога моделей: проекторы изображений (mmproj) для Этапа 3. Ничего не скачивает.
on:
  workflow_dispatch:
  push:
    branches: [ccr-01928831-4evaxe]
    paths: [.github/workflows/model-catalog-report.yml]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Query Hugging Face metadata
        shell: python
        run: |
          import json, urllib.request
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "prism-ai-ci"}), timeout=60) as r:
                  return json.load(r)
          for q in ["SmolVLM", "gemma-3-4b", "gemma-4"]:
              found = get(f"https://huggingface.co/api/models?author=ggml-org&search={q}&limit=100")
              print(q, "repos:", sorted(m["id"] for m in found))
          repos = [
              "ggml-org/gemma-4-E2B-it-GGUF", "ggml-org/gemma-4-E4B-it-GGUF",
              "ggml-org/gemma-4-12B-it-GGUF", "ggml-org/gemma-4-26B-A4B-it-GGUF",
              "ggml-org/gemma-3-4b-it-GGUF",
              "ggml-org/SmolVLM-256M-Instruct-GGUF", "ggml-org/SmolVLM2-256M-Video-Instruct-GGUF",
              "ggml-org/SmolVLM-500M-Instruct-GGUF",
          ]
          for repo in repos:
              print("\n=== " + repo)
              try:
                  info = get(f"https://huggingface.co/api/models/{repo}")
                  card = info.get("cardData") or {}
                  print("gated:", info.get("gated"), "| license:", card.get("license"), card.get("license_name"), card.get("license_link"))
                  tree = get(f"https://huggingface.co/api/models/{repo}/tree/main?recursive=true")
                  for f in tree:
                      if f.get("type") == "file" and f["path"].endswith(".gguf"):
                          lfs = f.get("lfs") or {}
                          print(f'{f["path"]}\t{f.get("size")}\t{lfs.get("oid")}')
              except Exception as e:
                  print("ERROR", e)
