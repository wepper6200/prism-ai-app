name: Model catalog report

# Разовый отчёт о файлах моделей на Hugging Face (размеры, SHA-256, лицензии, доступ)
# для каталога: генерация изображений (FLUX.1 schnell, быстрые SDXL). Ничего не скачивает.
on:
  workflow_dispatch:
  push:
    branches: [ccr-01928831-4evaxe]
    paths: [.github/workflows/model-catalog-report.yml]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Query Hugging Face metadata
        shell: python
        run: |
          import json, urllib.request, urllib.parse
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "prism-ai-ci"}), timeout=60) as r:
                  return json.load(r)
          def search(q, limit=40):
              found = get("https://huggingface.co/api/models?search=" + urllib.parse.quote(q) + f"&sort=downloads&direction=-1&limit={limit}")
              print(f"\n### search '{q}':")
              for m in found:
                  print(f'  {m["id"]}  downloads={m.get("downloads")}  likes={m.get("likes")}')
          for q in ["FastSDXL", "fast-sdxl", "fastsdxl", "sdxl lightning gguf", "sdxl-turbo gguf", "hyper-sdxl gguf",
                    "sdxl gguf", "FLUX.1-schnell gguf", "t5-v1_1-xxl-encoder-gguf", "flux_text_encoders"]:
              try:
                  search(q)
              except Exception as e:
                  print("ERROR", q, e)
          repos = [
              "black-forest-labs/FLUX.1-schnell", "leejet/FLUX.1-schnell-gguf", "city96/FLUX.1-schnell-gguf",
              "second-state/FLUX.1-schnell-GGUF", "city96/t5-v1_1-xxl-encoder-gguf", "comfyanonymous/flux_text_encoders",
              "stabilityai/sdxl-turbo", "ByteDance/SDXL-Lightning", "ByteDance/Hyper-SD",
              "stabilityai/stable-diffusion-xl-base-1.0", "madebyollin/sdxl-vae-fp16-fix",
          ]
          for repo in repos:
              print("\n=== " + repo)
              try:
                  info = get(f"https://huggingface.co/api/models/{repo}")
                  card = info.get("cardData") or {}
                  print("gated:", info.get("gated"), "| license:", card.get("license"), card.get("license_name"), card.get("license_link"))
                  tree = get(f"https://huggingface.co/api/models/{repo}/tree/main?recursive=true")
                  for f in tree:
                      p = f["path"]
                      if f.get("type") == "file" and p.endswith((".gguf", ".safetensors")) and "/" not in p.strip("/").replace("text_encoder", "").replace("vae", "") or p.count("/") <= 1 and p.endswith((".gguf", ".safetensors")):
                          lfs = f.get("lfs") or {}
                          print(f'{p}\t{f.get("size")}\t{lfs.get("oid")}')
              except Exception as e:
                  print("ERROR", e)
