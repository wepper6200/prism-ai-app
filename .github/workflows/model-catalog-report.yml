name: Model catalog report

# Разовый отчёт о файлах моделей на Hugging Face (размеры, SHA-256, лицензии, доступ)
# для каталога: генерация изображений (FLUX.1 schnell, быстрые SDXL). Ничего не скачивает.
on:
  workflow_dispatch:
  push:
    branches: [ccr-01928831-4evaxe]
    paths: [.github/workflows/model-catalog-report.yml]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Query Hugging Face metadata
        shell: python
        run: |
          import json, urllib.request, urllib.parse
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "prism-ai-ci"}), timeout=60) as r:
                  return json.load(r)
          def search(q, limit=40):
              found = get("https://huggingface.co/api/models?search=" + urllib.parse.quote(q) + f"&sort=downloads&direction=-1&limit={limit}")
              print(f"\n### search '{q}':")
              for m in found:
                  print(f'  {m["id"]}  downloads={m.get("downloads")}  likes={m.get("likes")}')
          for repo in ["vladmandic/fast-sdxl", "mzwing/SDXL-Lightning-GGUF", "OlegSkutte/SDXL-Lightning-GGUF",
                       "hum-ma/SDXL-models-GGUF", "second-state/stable-diffusion-xl-base-1.0-GGUF", "OlegSkutte/sdxl-turbo-GGUF"]:
              print("\n=== " + repo)
              try:
                  info = get(f"https://huggingface.co/api/models/{repo}")
                  card = info.get("cardData") or {}
                  print("gated:", info.get("gated"), "| license:", card.get("license"), card.get("license_name"), card.get("license_link"),
                        "| base:", card.get("base_model"), "| tags:", info.get("tags"))
                  tree = get(f"https://huggingface.co/api/models/{repo}/tree/main?recursive=true")
                  for f in tree:
                      if f.get("type") == "file" and f["path"].endswith((".gguf", ".safetensors", ".ckpt")):
                          lfs = f.get("lfs") or {}
                          print(f'{f["path"]}\t{f.get("size")}\t{lfs.get("oid")}')
                  try:
                      with urllib.request.urlopen(urllib.request.Request(f"https://huggingface.co/{repo}/raw/main/README.md", headers={"User-Agent": "prism-ai-ci"}), timeout=60) as r:
                          print("--- README ---\n" + r.read().decode("utf-8", "replace")[:2500])
                  except Exception as e:
                      print("no README", e)
              except Exception as e:
                  print("ERROR", e)
