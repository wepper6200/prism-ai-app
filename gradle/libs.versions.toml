[versions]
# Версия приложения Prism AI (единый источник для Android, Desktop и экрана «О приложении»).
prism-versionName = "0.9.5"
prism-versionCode = "15"
# Версия Prism Store (выходит в тех же релизах GitHub, что и Prism AI).
store-versionName = "1.0.1"
store-versionCode = "2"

android-compileSdk = "37"
android-targetSdk = "37"
android-minSdk = "29"
# NDK и CMake для сборки llama.cpp под Android (как в официальном примере llama.android).
android-ndk = "29.0.13113456"
android-cmake = "3.31.6"

# Все версии сверены с последними стабильными релизами (ноябрь 2026).
kotlin = "2.4.21"
agp = "9.5.1"
compose-multiplatform = "1.12.2"
compose-material3 = "1.9.0"
compose-material-icons = "1.7.3"
androidx-activity = "1.13.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.12.0"
koin = "4.2.2"
sqldelight = "2.4.1"
decompose = "3.5.0"
essenty = "2.7.1"
# Текст PDF: Apache PDFBox на Desktop и его порт PdfBox-Android на Android (Apache 2.0).
pdfbox = "3.0.8"
pdfbox-android = "2.0.27.0"
# Голос: sherpa-onnx (распознавание и синтез речи на onnxruntime). 1.13.8 — последняя версия с espeak-ng,
# без которого не работают голоса Piper (в 2.0 его убрали). Файлы — из релизов GitHub (см. settings.gradle.kts).
sherpa-onnx = "1.13.8"
# Распаковка архивов голосов Piper (tar.bz2).
commons-compress = "1.28.0"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icons" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }

decompose = { module = "com.arkivanov.decompose:decompose", version.ref = "decompose" }
decompose-extensions-compose = { module = "com.arkivanov.decompose:extensions-compose", version.ref = "decompose" }
essenty-lifecycle = { module = "com.arkivanov.essenty:lifecycle", version.ref = "essenty" }

pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox-android" }
sherpa-onnx-jvm = { module = "com.k2fsa.sherpa-onnx:sherpa-onnx-jvm", version.ref = "sherpa-onnx" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
